services:
  - type: web
    name: ws-relay-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SECRET_TOKEN
        sync: false   # 在 Render 控制台手动设置一个长随机字符串
      - key: NODE_VERSION
        value: 18
    healthCheckPath: /health
    autoDeploy: true